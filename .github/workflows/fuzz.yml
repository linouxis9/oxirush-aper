name: Fuzz

# The fuzz targets of fuzz/, and those of protocols/fuzz/ on TOY, the protocol of the
# tests, and with the crates oxirush-ngap and oxirush-s1ap, which are checked out beside
# this repository at the head of their default branch, as their CI checks them out, longer
# than the minute that each has at a push: an hour for each every night, and four hours
# for each on Sunday afternoon, once the mutation runs that start on Saturday evening are
# over, within the six hours that GitHub gives a job; the minutes of `minutes` when the
# workflow is started by hand. The jobs of the protocols are those of protocol-fuzz.yml,
# which the Fuzz workflow of each protocol crate calls too, with the crate at its commit
# and this repository at the revision that its build/revisions records. The corpus of each
# target is kept from one run to the next in the cache of the repository, and grows; the
# seeds of the repository are added to it each time. On Sunday, and when `weekly` is set
# by hand, each corpus is then minimized (`cargo fuzz cmin`) before it is kept, and the
# coverage of the crates by the minimized corpus (`cargo fuzz coverage`) is kept for 30
# days, as a report and as pages: what no input reaches is what a target or a seed is to
# reach next. A crash or a timeout fails the job, which keeps the input and the log: the
# input goes into the seeds with its fix.
on:
  schedule:
    - cron: "13 4 * * 1-6"
    - cron: "13 12 * * 0"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes for each target
        type: number
        default: 60
      weekly:
        description: Minimize each corpus and report its coverage, as on Sunday
        type: boolean
        default: false

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # How long each target runs: four hours on Sunday, an hour on the other nights, with
  # or without a commit. The summary of the run lists the commits that no run had
  # fuzzed before.
  plan:
    name: How long
    runs-on: ubuntu-24.04
    outputs:
      seconds: ${{ steps.plan.outputs.seconds }}
      timeout: ${{ steps.plan.outputs.timeout }}
      weekly: ${{ steps.plan.outputs.weekly }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WEEKLY: "13 12 * * 0"
          SCHEDULE: ${{ github.event.schedule }}
          MINUTES: ${{ inputs.minutes }}
          REPORT: ${{ inputs.weekly }}
        run: |
          # The head of the last run of this workflow on this branch that ended after its
          # plan, or the empty tree: the commits after it are those that this run fuzzes
          # first, however late a run starts and however old the date of a commit is. A
          # run whose plan succeeded and whose fuzzing then failed, for a crash as for a
          # lost runner, is such a base too: it stays red until someone reads it, and is run
          # again itself.
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fuzz.yml \
            --branch "$GITHUB_REF_NAME" --status completed --limit 100 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .databaseId')
          base=
          for run in $runs; do
            base=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha,jobs --jq '
              select(any(.jobs[]; .name == "How long" and .conclusion == "success"))
              | .headSha')
            if [ -n "$base" ]; then break; fi
          done
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git hash-object -t tree /dev/null)
          fi
          if [ "$SCHEDULE" = "$WEEKLY" ] || [ "$REPORT" = true ]; then
            weekly=true
          else
            weekly=false
          fi
          if [ -n "$MINUTES" ]; then
            minutes=$MINUTES
          elif [ "$SCHEDULE" = "$WEEKLY" ]; then
            minutes=240
          else
            minutes=60
          fi
          echo "seconds=$((minutes * 60))" >> "$GITHUB_OUTPUT"
          # The build, the corpus and the upload besides, and on Sunday the
          # minimized corpus and its coverage; never past the six hours of a job
          extra=30
          if [ "$weekly" = true ]; then extra=60; fi
          timeout=$((minutes + extra))
          if [ "$timeout" -gt 355 ]; then timeout=355; fi
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"
          {
            echo "Each target runs $minutes minutes."
            echo
            if [ "$base" = "$(git hash-object -t tree /dev/null)" ]; then
              echo "No run of this branch ended after its plan: every commit is fuzzed first."
            elif [ "$base" = "$(git rev-parse HEAD)" ]; then
              echo "No commit since the last run, at $base."
            else
              echo "Fuzzed first, since $base:"
              echo
              git log --format='- %h %s' "$base..HEAD"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.seconds != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      max-parallel: 3
      # The targets of TOY that read octets take the dictionary that seed.sh writes: the
      # header of each message and each IE of each message. Those that build their input
      # with `arbitrary` try inputs of any length from the start.
      matrix:
        include:
          - { target: fields, max_len: 512 }
          - { protocol: toy, target: decode, max_len: 4096, flags: -dict=fuzz/corpus/protocol.dict }
          - { protocol: toy, target: json, max_len: 4096, flags: -dict=fuzz/corpus/protocol.dict }
          - { protocol: toy, target: paths, max_len: 4096 }
          - { protocol: toy, target: exact, max_len: 4096, flags: -dict=fuzz/corpus/protocol.dict }
          - { protocol: toy, target: edit, max_len: 1024, flags: -len_control=0 }
          - { protocol: toy, target: tree, max_len: 1024, flags: -len_control=0 }
    env:
      # What the targets of protocols/fuzz/ take from the inside of TOY.
      RUSTFLAGS: ${{ matrix.protocol && '--cfg oxirush_toy_hooks' || '' }}
      PROTOCOL: ${{ matrix.protocol }}
    defaults:
      run:
        working-directory: oxirush-aper/${{ matrix.protocol && 'protocols/toy' || '.' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxirush-aper
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxirush-aper/${{ matrix.protocol && 'protocols/toy/' || '' }}fuzz
      - run: cargo install cargo-fuzz@0.13.2 --locked
      - uses: actions/cache/restore@v4
        with:
          path: oxirush-aper/${{ matrix.protocol && 'protocols/toy/' || '' }}fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.protocol || 'crate' }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.protocol || 'crate' }}-${{ matrix.target }}-
      # The seeds of TOY: the PDUs of its tests/fixtures, each also under a procedure
      # code that the protocol does not have, and the dictionary.
      - if: matrix.protocol
        run: ../fuzz/seed.sh
      # The corpus takes what the run finds. An input that takes more than 30
      # seconds is a timeout.
      - name: Fuzz ${{ matrix.target }} for ${{ needs.plan.outputs.seconds }} seconds
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ needs.plan.outputs.seconds }}
          MAX_LEN: ${{ matrix.max_len }}
          FLAGS: ${{ matrix.flags }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          # FLAGS is one option, or none
          cargo fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time="$FUZZ_SECONDS" -timeout=30 -max_len="$MAX_LEN" ${FLAGS:+"$FLAGS"} 2>&1 |
            tee "$RUNNER_TEMP/fuzz.log"
      # On Sunday: the inputs that reach nothing that the others do not are
      # dropped.
      - name: Minimize the corpus
        if: needs.plan.outputs.weekly == 'true'
        env:
          TARGET: ${{ matrix.target }}
          MAX_LEN: ${{ matrix.max_len }}
        run: |
          before=$(find "fuzz/corpus/$TARGET" -type f | wc -l)
          cargo fuzz cmin "$TARGET" "fuzz/corpus/$TARGET" -- -max_len="$MAX_LEN"
          after=$(find "fuzz/corpus/$TARGET" -type f | wc -l)
          echo "The corpus of ${PROTOCOL:+$PROTOCOL }$TARGET: $before inputs, $after once minimized." \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: oxirush-aper/${{ matrix.protocol && 'protocols/toy/' || '' }}fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.protocol || 'crate' }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      # On Sunday: the regions, functions and lines of the crate that the corpus
      # reaches, file by file, and the pages of the sources with the count of each line.
      - name: Coverage of the corpus
        if: needs.plan.outputs.weekly == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo fuzz coverage "$TARGET" "fuzz/corpus/$TARGET" --target-dir fuzz/target-coverage
          llvm_cov=$(find "$(rustc --print sysroot)" -name llvm-cov -type f | head -n 1)
          binary="fuzz/target-coverage/x86_64-unknown-linux-gnu/release/$TARGET"
          profile="fuzz/coverage/$TARGET/coverage.profdata"
          # The crate, and TOY; not the targets
          ignore='/\.cargo/registry/|/rustc/|/fuzz/'
          mkdir -p "$RUNNER_TEMP/coverage"
          "$llvm_cov" report "$binary" -instr-profile="$profile" -ignore-filename-regex="$ignore" \
            > "$RUNNER_TEMP/coverage/report.txt"
          "$llvm_cov" show "$binary" -instr-profile="$profile" -ignore-filename-regex="$ignore" \
            -format=html -output-dir="$RUNNER_TEMP/coverage/pages"
          {
            echo "Coverage by the corpus of ${PROTOCOL:+$PROTOCOL }$TARGET:"
            echo
            echo '```'
            head -n 2 "$RUNNER_TEMP/coverage/report.txt"
            tail -n 1 "$RUNNER_TEMP/coverage/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.weekly == 'true'
        with:
          name: coverage-${{ matrix.protocol || 'crate' }}-${{ matrix.target }}
          path: ${{ runner.temp }}/coverage
          retention-days: 30
      # The input of the crash or of the timeout, to reproduce it with
      # `cargo fuzz run TARGET FILE`, and the log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.protocol || 'crate' }}-${{ matrix.target }}
          path: |
            oxirush-aper/${{ matrix.protocol && 'protocols/toy/' || '' }}fuzz/artifacts/${{ matrix.target }}
            ${{ runner.temp }}/fuzz.log

  # The targets of each protocol with the crate at the head of its default branch, three
  # at a time, as those of fuzz/ and of TOY. A dispatch gives its minutes as text, which fromJSON makes the number that
  # the called workflow takes, as it does the boolean of `weekly`; a schedule gives
  # neither.
  ngap:
    name: ngap
    uses: ./.github/workflows/protocol-fuzz.yml
    with:
      protocol: ngap
      weekly: "13 12 * * 0"
      minutes: ${{ fromJSON(inputs.minutes || '0') }}
      report: ${{ fromJSON(inputs.weekly || 'false') }}
      parallel: 3

  s1ap:
    name: s1ap
    uses: ./.github/workflows/protocol-fuzz.yml
    with:
      protocol: s1ap
      weekly: "13 12 * * 0"
      minutes: ${{ fromJSON(inputs.minutes || '0') }}
      report: ${{ fromJSON(inputs.weekly || 'false') }}
      parallel: 3
