name: Fuzz

# The fuzz targets of fuzz/, and those of protocols/fuzz/ on TOY, the protocol of the
# tests, longer than the minute that each has at a push: the jobs of crate-fuzz.yml,
# which the Fuzz workflow of every crate of the family calls too. An hour for each
# every day but Sunday, from 04:23 UTC, one target at a time, and on Monday four hours
# for each, three at a time, less when the fuzzing of a run would not end within the
# eight hours that crate-fuzz.yml gives it. The targets of protocols/fuzz/ on NGAP and
# S1AP run in the Fuzz workflows of oxirush-ngap and oxirush-s1ap, with the revision of
# this repository that each records. The crates of the family fuzz each at an hour of
# its own, with few jobs at once, and each has a day of its own for its long run, so
# that what they run at once leaves runners to the other CI (GitHub starts a scheduled
# run hours after its time, in their order). On Monday, and when `weekly` is set by
# hand, each corpus is minimized and its coverage kept for 30 days.
on:
  schedule:
    - cron: "23 4 * * 2-6"
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes for each target
        type: number
        default: 60
      weekly:
        description: Minimize each corpus and report its coverage, as on Monday
        type: boolean
        default: false

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

# A dispatch gives its minutes as text, which fromJSON makes the number that the called
# workflow takes, as it does the boolean of `weekly`; a schedule gives neither.
jobs:
  # The targets of TOY that read octets take the dictionary that its seed.sh writes: the
  # header of each message and each IE of each message. Those that build their input
  # with `arbitrary` try inputs of any length from the start. Its seeds are the PDUs of
  # its tests/fixtures, each also under a procedure code that the protocol does not have.
  fuzz:
    uses: ./.github/workflows/crate-fuzz.yml
    with:
      weekly: "23 4 * * 1"
      minutes: ${{ fromJSON(inputs.minutes || '0') }}
      report: ${{ fromJSON(inputs.weekly || 'false') }}
      weekly-parallel: 3
      path: oxirush-aper
      setup: '[ "$NAME" != toy ] || ../fuzz/seed.sh'
      targets: >-
        [{"target": "fields", "max_len": 512, "dir": "oxirush-aper", "name": "crate"},
         {"target": "decode", "max_len": 4096, "flags": "-dict=fuzz/corpus/protocol.dict", "dir": "oxirush-aper/protocols/toy", "name": "toy"},
         {"target": "json", "max_len": 4096, "flags": "-dict=fuzz/corpus/protocol.dict", "dir": "oxirush-aper/protocols/toy", "name": "toy"},
         {"target": "paths", "max_len": 4096, "dir": "oxirush-aper/protocols/toy", "name": "toy"},
         {"target": "exact", "max_len": 4096, "flags": "-dict=fuzz/corpus/protocol.dict", "dir": "oxirush-aper/protocols/toy", "name": "toy"},
         {"target": "edit", "max_len": 1024, "flags": "-len_control=0", "dir": "oxirush-aper/protocols/toy", "name": "toy"},
         {"target": "tree", "max_len": 1024, "flags": "-len_control=0", "dir": "oxirush-aper/protocols/toy", "name": "toy"},
         {"target": "transfer", "max_len": 1024, "flags": "-len_control=0", "dir": "oxirush-aper/protocols/toy", "name": "toy"},
         {"target": "jer", "max_len": 1024, "flags": "-len_control=0", "dir": "oxirush-aper/protocols/toy", "name": "toy"}]
