name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run of a branch, or of a pull request, cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # 32 bits, where a `usize` holds less than a `u64`.
  i686:
    name: Tests on 32 bits (i686-unknown-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --target i686-unknown-linux-musl

  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --target thumbv7em-none-eabihf
      # Every feature but `std`, the register of protocols, a lock of the standard library.
      - run: cargo build --lib --target thumbv7em-none-eabihf --features inspect

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The packages beside the crate: the generator of the bindings, and the benchmarks.
  packages:
    name: Generator and benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            generator
            benches
      - run: cargo test --manifest-path generator/Cargo.toml
      - run: cargo clippy --manifest-path generator/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path benches/Cargo.toml --no-run
      # The examples of the tools that the protocol crates run from protocols/
      - run: python3 -m doctest protocols/benches/build_cost.py

  # TOY, a protocol that the generator writes from the ASN.1 of protocols/toy/toy as it
  # writes NGAP and S1AP, a member of the workspace: its tests are those of what the
  # generated crates share, and its bindings are those that the generator writes again.
  toy:
    name: TOY, the generated protocol of the shared tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: protocols/toy
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            protocols/toy/build
      - run: cargo test --all-features
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --check
      - name: The bindings are those that the generator writes
        run: |
          CARGO="$(command -v cargo)" cargo run --locked --manifest-path build/Cargo.toml
          rustfmt --edition 2024 src/toy.rs src/registry.rs src/inspect_registry.rs
          git diff --exit-code -- src

  fuzz:
    name: Fuzz the fields (1 minute)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run fields -- -max_total_time=60 -max_len=512

  # The targets of protocols/fuzz/, which oxirush-ngap and oxirush-s1ap run on their
  # protocols, on TOY, a minute each: its PDUs are small, so that a fault of the trees,
  # the paths or the checks that the generated crates share shows at the commit, before
  # a protocol crate takes it. Each corpus starts from the PDUs of its tests/fixtures.
  toy-fuzz:
    name: Fuzz TOY (8 minutes)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: protocols/toy
    env:
      # What the targets take from the inside of TOY.
      RUSTFLAGS: --cfg oxirush_toy_hooks
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: protocols/toy/fuzz
      - run: cargo install cargo-fuzz --locked
      - run: ../fuzz/seed.sh
      - run: cargo fuzz run decode -- -max_total_time=60 -max_len=4096 -dict=fuzz/corpus/protocol.dict
      - run: cargo fuzz run json -- -max_total_time=60 -max_len=4096 -dict=fuzz/corpus/protocol.dict
      - run: cargo fuzz run paths -- -max_total_time=60 -max_len=4096
      - run: cargo fuzz run exact -- -max_total_time=60 -max_len=4096 -dict=fuzz/corpus/protocol.dict
      - run: cargo fuzz run edit -- -max_total_time=60 -max_len=1024 -len_control=0
      - run: cargo fuzz run tree -- -max_total_time=60 -max_len=1024 -len_control=0
      - run: cargo fuzz run transfer -- -max_total_time=60 -max_len=1024 -len_control=0
      - run: cargo fuzz run jer -- -max_total_time=60 -max_len=1024 -len_control=0


  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path generator/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      # What oxirush-ngap and oxirush-s1ap take from `protocols/`, which no package of this
      # repository builds; the program of hampi is of the edition 2021.
      - run: rustfmt --edition 2024 --check $(git ls-files 'protocols/*.rs' ':!:protocols/benches/compare/hampi/*')
      - run: rustfmt --edition 2021 --check $(git ls-files 'protocols/benches/compare/hampi/*.rs')
