name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With rasn as the oracle of tests/rasn.rs.
      - run: cargo test --all-features
      - run: cargo test

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # 32 bits, where a `usize` holds less than a `u64`.
  i686:
    name: Tests on 32 bits (i686-unknown-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --target i686-unknown-linux-musl

  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --target thumbv7em-none-eabihf
      - run: cargo build --lib --target thumbv7em-none-eabihf --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The packages beside the crate: the generator of the bindings, and the benchmarks.
  packages:
    name: Generator and benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            generator
            benches
      - run: cargo test --manifest-path generator/Cargo.toml
      - run: cargo clippy --manifest-path generator/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path benches/Cargo.toml --no-run

  # `value` compares the crate with rasn, another implementation, on the octets that
  # it finds.
  fuzz:
    name: Fuzz the fields, and a value against rasn (2 minutes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run fields -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run value -- -max_total_time=60 -max_len=512

  # The block of the README that uses oxirush-ngap: `family/` is a package of its own,
  # which takes it at the version of its manifest, so that the crate depends on none of
  # the family. It compares what the block prints with the README.
  family:
    name: The README block with oxirush-ngap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: family
      - run: cargo test --manifest-path family/Cargo.toml
      - run: cargo clippy --manifest-path family/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path family/Cargo.toml

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path generator/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      # What oxirush-ngap and oxirush-s1ap take from `protocols/`, which no package of this
      # repository builds; the program of hampi is of the edition 2021.
      - run: rustfmt --edition 2024 --check $(git ls-files 'protocols/*.rs' ':!:protocols/benches/compare/hampi/*')
      - run: rustfmt --edition 2021 --check $(git ls-files 'protocols/benches/compare/hampi/*.rs')
