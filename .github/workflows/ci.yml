name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # oxirush-utils, which the feature `inspect` takes, is not on crates.io yet, and cargo
  # resolves an optional dependency without its feature too: every build takes the commit
  # that build/revisions records, which build/pin.py writes here.
  UNPUBLISHED: >-
    --config patch.crates-io.oxirush-utils.git="https://github.com/linouxis9/oxirush-utils"
    --config patch.crates-io.oxirush-utils.rev="6b492da612f8050924d7f19b590c3fa77d2e3646"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With rasn as the oracle of tests/rasn.rs.
      - run: cargo test $UNPUBLISHED --all-features
      - run: cargo test $UNPUBLISHED

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $UNPUBLISHED --all-features

  # 32 bits, where a `usize` holds less than a `u64`.
  i686:
    name: Tests on 32 bits (i686-unknown-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $UNPUBLISHED --all-features --target i686-unknown-linux-musl

  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build $UNPUBLISHED --lib --target thumbv7em-none-eabihf
      - run: cargo build $UNPUBLISHED --lib --target thumbv7em-none-eabihf --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy $UNPUBLISHED --all-targets --all-features -- -D warnings
      - run: cargo clippy $UNPUBLISHED --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc $UNPUBLISHED --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The packages beside the crate: the generator of the bindings, and the benchmarks.
  packages:
    name: Generator and benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            generator
            benches
      - run: cargo test --manifest-path generator/Cargo.toml
      - run: cargo clippy --manifest-path generator/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path benches/Cargo.toml --no-run

  # `value` compares the crate with rasn, another implementation, on the octets that
  # it finds.
  fuzz:
    name: Fuzz the fields, and a value against rasn (2 minutes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run fields -- -max_total_time=60 -max_len=512
      - run: cargo fuzz run value -- -max_total_time=60 -max_len=512

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path generator/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
