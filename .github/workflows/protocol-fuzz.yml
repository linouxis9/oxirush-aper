name: Protocol fuzz

# The nightly fuzzing of oxirush-ngap and oxirush-s1ap: the targets of protocols/fuzz/,
# longer than the minute that each has at a push, an hour each every night and four hours
# each on the weekly schedule of the workflow that calls this one, within the six hours
# that GitHub gives a job; the minutes of `minutes` when that workflow is started by hand.
# The Fuzz workflow of each protocol crate calls it at the revision of this repository
# that its build/revisions records, with the name of its protocol: the crate is fuzzed at
# its commit, with the checkout of oxirush-aper at that revision beside it. The Fuzz
# workflow of this repository calls it for each protocol too: the crate at the head of its
# default branch, with this commit beside it. The corpus of each target is kept from one
# run to the next in the cache of the repository that calls, and grows; the seeds of
# seed.sh, the PDUs of tests/fixtures and of tests/wireshark/corpus.tsv of the crate, are
# added to it each time. On the weekly schedule, and when `report` is set, each corpus is
# then minimized (`cargo fuzz cmin`) before it is kept, and the coverage of the crates by
# the minimized corpus (`cargo fuzz coverage`) is kept for 30 days, as a report and as
# pages. A crash or a timeout fails the job, which keeps the input and the log: the input
# goes into tests/fixtures/fuzzed.tsv of the crate with its fix.
on:
  workflow_call:
    inputs:
      protocol:
        description: The protocol of the crate, `ngap` or `s1ap`
        required: true
        type: string
      weekly:
        description: The cron of the schedule of the caller that runs long and minimizes
        required: true
        type: string
      weekly-minutes:
        description: Minutes for each target on the weekly schedule
        type: number
        default: 240
      minutes:
        description: Minutes for each target, rather than those of the schedule
        type: number
        default: 0
      report:
        description: Minimize each corpus and report its coverage, as on the weekly schedule
        type: boolean
        default: false
      parallel:
        description: The targets that run at once
        type: number
        default: 6

# The plan reads the runs of the Fuzz workflow of the crate, to find where the last one
# ended.
permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # What runs and for how long: the crate and oxirush-aper at their revisions, four hours
  # for each target on the weekly schedule, an hour on the other nights, with or without a
  # commit. When the crate calls, the summary of the run lists its commits that no run had
  # fuzzed before.
  plan:
    name: How long
    runs-on: ubuntu-24.04
    outputs:
      seconds: ${{ steps.plan.outputs.seconds }}
      timeout: ${{ steps.plan.outputs.timeout }}
      weekly: ${{ steps.plan.outputs.weekly }}
      crate: ${{ steps.plan.outputs.crate }}
      crate-revision: ${{ steps.plan.outputs.crate-revision }}
      aper: ${{ steps.plan.outputs.aper }}
      aper-revision: ${{ steps.plan.outputs.aper-revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PROTOCOL: ${{ inputs.protocol }}
          WEEKLY: ${{ inputs.weekly }}
          SCHEDULE: ${{ github.event.schedule }}
          MINUTES: ${{ inputs.minutes }}
          WEEKLY_MINUTES: ${{ inputs.weekly-minutes }}
          REPORT: ${{ inputs.report }}
        run: |
          empty=$(git hash-object -t tree /dev/null)
          if [ -f build/revisions ]; then
            # The crate calls: its commit, with the revision of oxirush-aper that its
            # build/revisions records. The head of the last run of its Fuzz workflow on
            # this branch that ended after its plan, or the empty tree, is where the
            # commits that this run fuzzes first start, however late a run starts and
            # however old the date of a commit is. A run whose plan succeeded and whose
            # fuzzing then failed, for a crash as for a lost runner, is such a base too: it
            # stays red until someone reads it, and is run again itself.
            crate=$GITHUB_REPOSITORY
            crate_revision=$GITHUB_SHA
            aper=linouxis9/oxirush-aper
            aper_revision=$(awk '$1 == "oxirush-aper" { print $2 }' build/revisions)
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fuzz.yml \
              --branch "$GITHUB_REF_NAME" --status completed --limit 100 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .databaseId')
            base=
            for run in $runs; do
              base=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha,jobs --jq '
                select(any(.jobs[]; (.name | endswith("How long")) and .conclusion == "success"))
                | .headSha')
              if [ -n "$base" ]; then break; fi
            done
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$empty
            fi
          else
            # oxirush-aper calls: the crate at the head of its default branch, as the CI of
            # this repository checks it out, with this commit. The Fuzz workflow of this
            # repository lists its own commits.
            crate=linouxis9/oxirush-$PROTOCOL
            crate_revision=$(git ls-remote "https://github.com/$crate" HEAD | cut -f 1)
            aper=$GITHUB_REPOSITORY
            aper_revision=$GITHUB_SHA
            base=
          fi
          if [ "$SCHEDULE" = "$WEEKLY" ] || [ "$REPORT" = true ]; then
            weekly=true
          else
            weekly=false
          fi
          if [ "$MINUTES" != 0 ]; then
            minutes=$MINUTES
          elif [ "$SCHEDULE" = "$WEEKLY" ]; then
            minutes=$WEEKLY_MINUTES
          else
            minutes=60
          fi
          echo "seconds=$((minutes * 60))" >> "$GITHUB_OUTPUT"
          # The build, the corpus and the upload besides, and on the weekly schedule the
          # minimized corpus and its coverage; never past the six hours of a job
          extra=30
          if [ "$weekly" = true ]; then extra=60; fi
          timeout=$((minutes + extra))
          if [ "$timeout" -gt 355 ]; then timeout=355; fi
          {
            echo "timeout=$timeout"
            echo "weekly=$weekly"
            echo "crate=$crate"
            echo "crate-revision=$crate_revision"
            echo "aper=$aper"
            echo "aper-revision=$aper_revision"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Each target of $crate $crate_revision, with $aper $aper_revision, runs $minutes minutes."
            echo
            if [ -z "$base" ]; then
              :
            elif [ "$base" = "$empty" ]; then
              echo "No run of this branch ended after its plan: every commit is fuzzed first."
            elif [ "$base" = "$(git rev-parse HEAD)" ]; then
              echo "No commit since the last run, at $base."
            else
              echo "Fuzzed first, since $base:"
              echo
              git log --format='- %h %s' "$base..HEAD"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.seconds != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.parallel }}
      # The targets that read octets take the dictionary that seed.sh writes: the header
      # of each message and each IE of each message. Those that build their input with
      # `arbitrary` try inputs of any length from the start.
      matrix:
        include:
          - { target: decode, max_len: 4096, flags: -dict=fuzz/corpus/protocol.dict }
          - { target: json, max_len: 4096, flags: -dict=fuzz/corpus/protocol.dict }
          - { target: paths, max_len: 4096 }
          - { target: exact, max_len: 4096, flags: -dict=fuzz/corpus/protocol.dict }
          - { target: edit, max_len: 1024, flags: -len_control=0 }
          - { target: tree, max_len: 1024, flags: -len_control=0 }
          - { target: transfer, max_len: 1024, flags: -len_control=0 }
          - { target: jer, max_len: 1024, flags: -len_control=0 }
    env:
      # What the targets take from the inside of the crate.
      RUSTFLAGS: --cfg oxirush_${{ inputs.protocol }}_hooks
      PROTOCOL: ${{ inputs.protocol }}
    defaults:
      run:
        working-directory: oxirush-${{ inputs.protocol }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.crate }}
          ref: ${{ needs.plan.outputs.crate-revision }}
          path: oxirush-${{ inputs.protocol }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.aper }}
          ref: ${{ needs.plan.outputs.aper-revision }}
          path: oxirush-aper
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxirush-${{ inputs.protocol }}/fuzz
      - run: cargo install cargo-fuzz@0.13.2 --locked
      - uses: actions/cache/restore@v4
        with:
          path: oxirush-${{ inputs.protocol }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ inputs.protocol }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ inputs.protocol }}-${{ matrix.target }}-
      # The seeds of the protocol: the PDUs of tests/fixtures and of
      # tests/wireshark/corpus.tsv, each also under a procedure code that the specification
      # does not have, and the dictionary.
      - run: ../oxirush-aper/protocols/fuzz/seed.sh
      # The corpus takes what the run finds. An input that takes more than 30 seconds is
      # a timeout.
      - name: Fuzz ${{ matrix.target }} for ${{ needs.plan.outputs.seconds }} seconds
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ needs.plan.outputs.seconds }}
          MAX_LEN: ${{ matrix.max_len }}
          FLAGS: ${{ matrix.flags }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          # FLAGS is one option, or none
          cargo fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time="$FUZZ_SECONDS" -timeout=30 -max_len="$MAX_LEN" ${FLAGS:+"$FLAGS"} 2>&1 |
            tee "$RUNNER_TEMP/fuzz.log"
      # On the weekly schedule: the inputs that reach nothing that the others do not are
      # dropped.
      - name: Minimize the corpus
        if: needs.plan.outputs.weekly == 'true'
        env:
          TARGET: ${{ matrix.target }}
          MAX_LEN: ${{ matrix.max_len }}
        run: |
          before=$(find "fuzz/corpus/$TARGET" -type f | wc -l)
          cargo fuzz cmin "$TARGET" "fuzz/corpus/$TARGET" -- -max_len="$MAX_LEN"
          after=$(find "fuzz/corpus/$TARGET" -type f | wc -l)
          echo "The corpus of $PROTOCOL $TARGET: $before inputs, $after once minimized." \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: oxirush-${{ inputs.protocol }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ inputs.protocol }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      # On the weekly schedule: the regions, functions and lines of the crate and of
      # oxirush-aper that the corpus reaches, file by file, and the pages of the sources
      # with the count of each line.
      - name: Coverage of the corpus
        if: needs.plan.outputs.weekly == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo fuzz coverage "$TARGET" "fuzz/corpus/$TARGET" --target-dir fuzz/target-coverage
          llvm_cov=$(find "$(rustc --print sysroot)" -name llvm-cov -type f | head -n 1)
          binary="fuzz/target-coverage/x86_64-unknown-linux-gnu/release/$TARGET"
          profile="fuzz/coverage/$TARGET/coverage.profdata"
          # The crate and oxirush-aper; not the targets
          ignore='/\.cargo/registry/|/rustc/|/fuzz/'
          mkdir -p "$RUNNER_TEMP/coverage"
          "$llvm_cov" report "$binary" -instr-profile="$profile" -ignore-filename-regex="$ignore" \
            > "$RUNNER_TEMP/coverage/report.txt"
          "$llvm_cov" show "$binary" -instr-profile="$profile" -ignore-filename-regex="$ignore" \
            -format=html -output-dir="$RUNNER_TEMP/coverage/pages"
          {
            echo "Coverage by the corpus of $PROTOCOL $TARGET:"
            echo
            echo '```'
            head -n 2 "$RUNNER_TEMP/coverage/report.txt"
            tail -n 1 "$RUNNER_TEMP/coverage/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The report and the pages, for 30 days. An upload that fails, as when GitHub's
      # artifact service is down, leaves the job green: its fuzzing found nothing, and
      # the next weekly run reports the coverage again.
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.weekly == 'true'
        continue-on-error: true
        with:
          name: coverage-${{ inputs.protocol }}-${{ matrix.target }}
          path: ${{ runner.temp }}/coverage
          retention-days: 30
      # The input of the crash or of the timeout, to reproduce it with
      # `cargo fuzz run TARGET FILE`, and the log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ inputs.protocol }}-${{ matrix.target }}
          path: |
            oxirush-${{ inputs.protocol }}/fuzz/artifacts/${{ matrix.target }}
            ${{ runner.temp }}/fuzz.log
