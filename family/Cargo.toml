# The block of the README that uses another crate of the family: oxirush-aper with
# oxirush-ngap, at the revisions that this manifest names. A package of its own, so that
# the crate depends on none of them: nothing here is published. `cargo test` here runs
# the block and compares what it prints with the README.
[package]
name = "oxirush-aper-family"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dev-dependencies]
oxirush-ngap = { git = "https://github.com/linouxis9/oxirush-ngap", rev = "eeddd94e6a8671945b9df23f46ad90adb421ba22" }
hex = "0.4"

# Not a member of a workspace that the crate may be in.
[workspace]

# oxirush-ngap takes this oxirush-aper, and comes from its repository until it is on
# crates.io.
[patch.crates-io]
oxirush-aper = { path = ".." }
