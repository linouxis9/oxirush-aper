# The benchmarks of oxirush-aper. A package of its own, so that the crate keeps
# no dependency: nothing here is published.
[package]
name = "oxirush-aper-benches"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
oxirush-aper = { path = ".." }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "fields"
harness = false

# Not a member of a workspace that the crate may be in.
[workspace]
