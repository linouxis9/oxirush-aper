[package]
name = "oxirush-aper"
version = "0.1.0"
edition = "2024"
description = "Aligned PER (ITU-T X.691) for Rust bindings generated from 3GPP ASN.1: a reader and a writer of the fields, and the types of the values"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-aper"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["asn1", "aper", "per", "x691", "3gpp"]
categories = ["encoding", "parser-implementations", "network-programming", "no-std"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[features]
# The JSON forms of a value, as the trees of `oxirush-utils`, and the paths into the views
# of the application protocols on them.
inspect = ["dep:oxirush-utils"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
oxirush-utils = { version = "0.1.0", optional = true, features = ["tree"] }

[dev-dependencies]
# The oracle of the tests: the codec of another implementation.
rasn = { version = "0.29.0", default-features = false, features = ["bytes"] }

[[test]]
name = "json"
required-features = ["inspect"]

[[test]]
name = "inspect"
required-features = ["inspect"]
