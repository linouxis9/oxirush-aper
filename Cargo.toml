[package]
name = "oxirush-aper"
version = "0.2.1"
edition = "2024"
description = "Aligned PER (ITU-T X.691) in Rust: the runtime of the bindings that oxirush-ngap and oxirush-s1ap generate from the 3GPP ASN.1, and the macros they share. no_std, no unsafe code."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-aper"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["asn1", "aper", "per", "x691", "3gpp"]
categories = ["encoding", "parser-implementations", "network-programming", "no-std"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE",
]

# TOY (protocols/toy/), the protocol whose tests are those of what the generated crates
# share: a member, so that the tests of a mutant of the crate are its tests too
# (.cargo/mutants.toml). `cargo test` at the root tests the crate alone.
[workspace]
members = ["protocols/toy"]

[features]
# The JSON forms of a value, as the trees of `oxirush-utils`, and the paths into the trees
# of the application protocols on them.
inspect = ["dep:oxirush-utils"]
# With `inspect`, the protocols that a program registers, whose types the octets of an IE
# of another protocol carry: the handover containers of S1AP in NGAP, and the reverse.
# The register is a lock of the standard library: without it, none is registered.
std = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
oxirush-utils = { version = "0.2.1", optional = true, features = ["tree"] }


[[test]]
name = "json"
required-features = ["inspect"]

[[test]]
name = "trees"
required-features = ["inspect"]
