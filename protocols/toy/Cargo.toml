# TOY, a protocol of a few procedures in the form of the application protocols of 3GPP,
# whose bindings the generator of this repository writes from the ASN.1 modules of
# `toy/`, as it writes those of oxirush-ngap and oxirush-s1ap. Its tests are the tests of
# what the generated crates share: the codec of a PDU, the macros, the checks and their
# diagnostics, the trees and their paths. It is not published, and is a member of the
# workspace of oxirush-aper, whose mutants its tests run on.
[package]
name = "oxirush-toy"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.88"

# The documentation of the PDU, which `__pdu!` writes, is that of the crates of 3GPP
# protocols: its examples are the messages of NGAP and S1AP.
[lib]
doctest = false

[features]
inspect = ["oxirush-aper/inspect", "oxirush-aper/std", "oxirush-utils/tree"]

[dependencies]
oxirush-aper = { path = "../.." }
oxirush-utils = "0.2.1"

[dev-dependencies]
hex = "0.4"
serde_json = "1.0.154"
