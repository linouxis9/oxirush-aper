# The fuzz targets of TOY, for cargo-fuzz: those of `protocols/fuzz/`, which oxirush-ngap
# and oxirush-s1ap run on their protocols, on the protocol of the tests of oxirush-aper,
# whose PDUs are small. A package of its own, which is not published. The targets name
# the crate `codec`.
[package]
name = "oxirush-toy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# What the targets do, which the programs call.
[lib]
name = "targets"
path = "../../fuzz/src/lib.rs"

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"
# The trees that the tables of the protocol make, which the target `generated` writes.
oxirush-aper = { path = "../../..", features = ["__checks"] }

[dependencies.codec]
package = "oxirush-toy"
path = ".."
features = ["inspect"]

# Not part of the workspace of oxirush-aper.
[workspace]
members = ["."]

# The revision of oxirush-utils that the walker of the trees needs, as the crate takes
# it, until its release.
[patch.crates-io]
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "4eae6c700f102dbf134e47f758e96799bee3f537" }

[[bin]]
name = "decode"
path = "../../fuzz/fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json"
path = "../../fuzz/fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "../../fuzz/fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exact"
path = "../../fuzz/fuzz_targets/exact.rs"
